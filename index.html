<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="大学の実習・演習向けランダムグループ分けツール">
    <title>実習グループ分けツール</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7f4;
        --paper: #ffffff;
        --soft: #eef3ef;
        --ink: #1d2528;
        --muted: #637078;
        --line: #d9e2dc;
        --teal: #12756f;
        --teal-dark: #084d49;
        --teal-soft: #dff3ef;
        --blue: #315f8b;
        --gold: #e5a928;
        --red: #b42318;
        --red-soft: #fee4e2;
        --green: #20704a;
        --shadow: 0 15px 34px rgba(31, 46, 43, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--bg);
      }

      body {
        min-width: 320px;
        margin: 0;
        overflow-x: hidden;
        background:
          linear-gradient(180deg, #e5efec 0, rgba(229, 239, 236, 0) 220px),
          var(--bg);
        color: var(--ink);
        font-family:
          "Yu Gothic UI",
          "Hiragino Kaku Gothic ProN",
          Meiryo,
          system-ui,
          sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
        touch-action: manipulation;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      .app {
        width: min(1120px, 100%);
        margin: 0 auto;
        padding: 12px 12px 28px;
      }

      .topbar {
        display: grid;
        gap: 10px;
        padding: 14px 4px 12px;
      }

      .topbar-main {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--teal-dark);
        font-size: 0.75rem;
        font-weight: 900;
      }

      h1 {
        margin-bottom: 0;
        font-size: 1.45rem;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
      }

      .stat {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 9px;
        background: rgba(255, 255, 255, 0.84);
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 900;
      }

      .stat strong {
        display: block;
        margin-top: 2px;
        font-size: 0.95rem;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 390px) minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }

      .panel {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 12px 8px;
      }

      .panel-header h2,
      .panel-header h3 {
        margin-bottom: 0;
        font-size: 1rem;
      }

      .panel-body {
        display: grid;
        gap: 12px;
        padding: 0 12px 12px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field-title {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 900;
      }

      .segmented {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 6px;
      }

      .two-col {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-flow: initial;
      }

      .button,
      .seg-button,
      .delete-button {
        min-width: 0;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 10px;
        background: var(--soft);
        color: var(--ink);
        font-weight: 900;
      }

      .seg-button.is-active {
        border-color: var(--teal);
        background: var(--teal);
        color: #fff;
      }

      .button.primary {
        border-color: var(--teal);
        background: var(--teal);
        color: #fff;
      }

      .button.secondary {
        border-color: var(--blue);
        background: #fff;
        color: var(--blue);
      }

      .button.warning {
        border-color: #d39b21;
        background: #fffaf0;
        color: #76510b;
      }

      .video-open-button {
        flex: 0 0 auto;
        min-height: 44px;
        border-color: var(--teal);
        background: var(--teal-dark);
        color: #fff;
        white-space: nowrap;
      }

      .student-select {
        width: 100%;
        min-width: 0;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 10px;
        background: #fff;
        color: var(--ink);
        font-weight: 800;
      }

      textarea {
        width: 100%;
        min-height: 176px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        resize: vertical;
        color: var(--ink);
        line-height: 1.55;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid rgba(18, 117, 111, 0.25);
        outline-offset: 2px;
      }

      .notice {
        border-radius: 8px;
        padding: 10px 11px;
        font-size: 0.86rem;
        font-weight: 900;
        line-height: 1.45;
      }

      .notice.info {
        border: 1px solid #bdd7e8;
        background: #e8f3fa;
        color: #234b6b;
      }

      .notice.success {
        border: 1px solid #b8ddc9;
        background: #e7f6ed;
        color: var(--green);
      }

      .notice.error {
        border: 1px solid #f0aaa3;
        background: var(--red-soft);
        color: var(--red);
      }

      .badge {
        display: inline-grid;
        place-items: center;
        min-width: 32px;
        min-height: 28px;
        border-radius: 8px;
        padding: 0 8px;
        background: var(--teal-soft);
        color: var(--teal-dark);
        font-size: 0.86rem;
        font-weight: 900;
      }

      .constraints {
        display: grid;
        gap: 7px;
        max-height: 235px;
        overflow: auto;
        padding-right: 2px;
      }

      .constraint-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        background: #fbfcfb;
      }

      .constraint-item.is-error {
        border-color: var(--red);
        background: var(--red-soft);
      }

      .constraint-main {
        min-width: 0;
      }

      .constraint-type {
        display: inline-block;
        margin-bottom: 4px;
        border-radius: 7px;
        padding: 3px 7px;
        background: #edf2f7;
        color: #29435c;
        font-size: 0.72rem;
        font-weight: 900;
      }

      .constraint-type.same {
        background: #e4f5e9;
        color: #20613d;
      }

      .constraint-type.separate {
        background: #fff3d7;
        color: #7a4c05;
      }

      .constraint-pair {
        display: block;
        overflow-wrap: anywhere;
        font-size: 0.9rem;
        font-weight: 900;
      }

      .delete-button {
        min-width: 54px;
        min-height: 38px;
        border-color: #e7c7c3;
        background: #fff;
        color: var(--red);
        font-size: 0.82rem;
      }

      .results-panel {
        overflow: hidden;
      }

      .result-head {
        display: grid;
        gap: 9px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.78);
      }

      .result-head-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .result-head h2 {
        margin-bottom: 0;
        font-size: 1.05rem;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
      }

      .metric {
        min-width: 0;
        border-radius: 8px;
        padding: 8px 9px;
        background: var(--soft);
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 900;
      }

      .metric strong {
        display: block;
        margin-top: 2px;
        font-size: 1rem;
      }

      .groups {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 10px;
      }

      .group-card {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }

      .group-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 8px 9px;
        background: #173b40;
        color: #fff;
      }

      .group-title h3 {
        margin-bottom: 0;
        font-size: 0.95rem;
      }

      .group-average {
        display: inline-grid;
        place-items: center;
        min-width: 54px;
        min-height: 28px;
        border-radius: 7px;
        background: var(--gold);
        color: #1f1908;
        font-size: 0.8rem;
        font-weight: 900;
      }

      .member-list {
        display: grid;
        gap: 2px;
        padding: 7px 8px 8px;
      }

      .member {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        min-width: 0;
        border-bottom: 1px solid #eef2ef;
        padding: 4px 0;
        font-size: 0.82rem;
        line-height: 1.25;
      }

      .member:last-child {
        border-bottom: 0;
      }

      .member-name {
        min-width: 0;
        overflow-wrap: anywhere;
        font-weight: 900;
      }

      .member-gpa {
        flex: 0 0 auto;
        color: var(--blue);
        font-variant-numeric: tabular-nums;
        font-weight: 900;
      }

      .empty {
        display: grid;
        grid-column: 1 / -1;
        place-items: center;
        min-height: 220px;
        padding: 20px;
        color: var(--muted);
        text-align: center;
        font-weight: 900;
      }

      .empty strong {
        color: var(--red);
      }

      details.panel summary {
        min-height: 46px;
        padding: 12px;
        color: var(--teal-dark);
        font-weight: 900;
        cursor: pointer;
      }

      .data-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .data-hint {
        margin: -5px 0 0;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .video-overlay {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        place-items: center;
        padding: 12px;
        background: rgba(18, 28, 30, 0.68);
      }

      .video-overlay.is-open {
        display: grid;
      }

      .video-dialog {
        width: min(900px, 100%);
        overflow: hidden;
        border-radius: 8px;
        background: var(--paper);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
      }

      .video-dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }

      .video-dialog-head h2 {
        margin-bottom: 0;
        font-size: 1rem;
      }

      .video-close {
        min-width: 64px;
      }

      .creation-video {
        display: block;
        width: 100%;
        max-height: min(72vh, 620px);
        background: #000;
      }

      body.video-lock {
        overflow: hidden;
      }

      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .controls-panel {
          order: 1;
          box-shadow: none;
        }

        .results-panel {
          order: 2;
        }

        .constraints-panel {
          order: 3;
        }

        .data-panel {
          order: 4;
        }

        .constraints {
          max-height: 185px;
        }
      }

      @media (max-width: 430px) {
        .app {
          padding-inline: 8px;
        }

        h1 {
          font-size: 1.28rem;
        }

        .topbar-main {
          align-items: flex-start;
        }

        .video-open-button {
          min-width: 96px;
          padding-inline: 8px;
        }

        .stats,
        .metrics {
          gap: 5px;
        }

        .stat,
        .metric {
          padding-inline: 7px;
        }

        .groups {
          gap: 7px;
          padding: 8px;
        }

        .group-title {
          padding-inline: 8px;
        }

        .member {
          font-size: 0.76rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-main">
          <div>
            <p class="eyebrow">Practice Group Mixer</p>
            <h1>実習グループ分けツール</h1>
          </div>
          <button class="button video-open-button" id="openVideoButton" type="button">作成動画</button>
        </div>
        <div class="stats" aria-label="現在の状態">
          <div class="stat">
            <span>学生</span>
            <strong id="studentCountStat">20名</strong>
          </div>
          <div class="stat">
            <span>班数</span>
            <strong id="groupCountStat">4班</strong>
          </div>
          <div class="stat">
            <span>制約</span>
            <strong id="constraintCountStat">3件</strong>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="panel controls-panel" aria-label="設定">
          <div class="panel-header">
            <h2>設定</h2>
          </div>
          <div class="panel-body">
            <div class="field">
              <span class="field-title">班数</span>
              <div class="segmented" id="groupCountButtons" aria-label="班数">
                <button class="seg-button" type="button" data-group-count="2">2</button>
                <button class="seg-button" type="button" data-group-count="3">3</button>
                <button class="seg-button is-active" type="button" data-group-count="4">4</button>
                <button class="seg-button" type="button" data-group-count="5">5</button>
                <button class="seg-button" type="button" data-group-count="6">6</button>
              </div>
            </div>

            <div class="field">
              <span class="field-title">分け方</span>
              <div class="segmented two-col" id="modeButtons" aria-label="分け方">
                <button class="seg-button" type="button" data-mode="random">完全ランダム</button>
                <button class="seg-button is-active" type="button" data-mode="gpa">GPA均等化</button>
              </div>
            </div>

            <div class="segmented two-col">
              <button class="button primary" id="runButton" type="button">グループ分け実行</button>
              <button class="button secondary" id="rerollButton" type="button">再抽選</button>
            </div>

            <div class="notice info" id="notice" role="status" aria-live="polite">
              サンプルデータとプリセット制約を読み込みました。
            </div>
          </div>
        </section>

        <section class="panel results-panel" aria-label="結果">
          <div class="result-head">
            <div class="result-head-top">
              <h2>結果</h2>
              <span class="badge" id="resultStatus">待機</span>
            </div>
            <div class="metrics" aria-label="結果指標">
              <div class="metric">
                <span>方式</span>
                <strong id="modeMetric">GPA均等化</strong>
              </div>
              <div class="metric">
                <span>班数</span>
                <strong id="groupMetric">4</strong>
              </div>
              <div class="metric">
                <span>最大差</span>
                <strong id="diffMetric">--</strong>
              </div>
            </div>
          </div>
          <div class="groups" id="groups">
            <div class="empty">未実行</div>
          </div>
        </section>

        <section class="panel constraints-panel" aria-label="制約">
          <div class="panel-header">
            <h2>制約</h2>
            <span class="badge" id="constraintCountBadge">3</span>
          </div>
          <div class="panel-body">
            <div class="field">
              <span class="field-title">学生</span>
              <div class="segmented two-col">
                <select class="student-select" id="studentA" aria-label="学生1"></select>
                <select class="student-select" id="studentB" aria-label="学生2"></select>
              </div>
            </div>

            <div class="field">
              <span class="field-title">関係</span>
              <div class="segmented two-col" id="relationButtons" aria-label="関係">
                <button class="seg-button is-active" type="button" data-relation="same">同じ班にする</button>
                <button class="seg-button" type="button" data-relation="separate">別の班にする</button>
              </div>
            </div>

            <button class="button primary" id="addConstraintButton" type="button">追加</button>
            <div class="constraints" id="constraintList"></div>
          </div>
        </section>

        <details class="panel data-panel">
          <summary>学生データ編集</summary>
          <div class="panel-body">
            <textarea id="studentDataInput" spellcheck="false" aria-label="学生データ"></textarea>
            <p class="data-hint">氏名,GPA</p>
            <div class="data-actions">
              <button class="button primary" id="applyDataButton" type="button">データ反映</button>
              <button class="button warning" id="resetDataButton" type="button">サンプルに戻す</button>
            </div>
          </div>
        </details>
      </main>
    </div>

    <div class="video-overlay" id="videoOverlay" aria-hidden="true">
      <div class="video-dialog" role="dialog" aria-modal="true" aria-labelledby="videoTitle">
        <div class="video-dialog-head">
          <h2 id="videoTitle">作成動画</h2>
          <button class="delete-button video-close" id="closeVideoButton" type="button">閉じる</button>
        </div>
        <video class="creation-video" id="creationVideo" controls playsinline preload="metadata">
          <source src="Video%20Project.mp4" type="video/mp4">
          動画を再生できません。
        </video>
      </div>
    </div>

    <script>
      const SAMPLE_STUDENTS = [
        { name: "学生01", gpa: 3.48 },
        { name: "学生02", gpa: 2.91 },
        { name: "学生03", gpa: 3.76 },
        { name: "学生04", gpa: 2.64 },
        { name: "学生05", gpa: 3.11 },
        { name: "学生06", gpa: 1.92 },
        { name: "学生07", gpa: 3.33 },
        { name: "学生08", gpa: 2.38 },
        { name: "学生09", gpa: 3.89 },
        { name: "学生10", gpa: 2.77 },
        { name: "学生11", gpa: 1.85 },
        { name: "学生12", gpa: 3.05 },
        { name: "学生13", gpa: 2.12 },
        { name: "学生14", gpa: 3.54 },
        { name: "学生15", gpa: 2.69 },
        { name: "学生16", gpa: 3.21 },
        { name: "学生17", gpa: 1.58 },
        { name: "学生18", gpa: 3.97 },
        { name: "学生19", gpa: 2.44 },
        { name: "学生20", gpa: 3.14 }
      ];

      const PRESET_CONSTRAINTS = [
        { a: "学生01", b: "学生02", type: "separate" },
        { a: "学生03", b: "学生04", type: "same" },
        { a: "学生05", b: "学生06", type: "separate" }
      ];

      const state = {
        students: cloneStudents(SAMPLE_STUDENTS),
        groupCount: 4,
        mode: "gpa",
        relation: "same",
        constraints: makePresetConstraints(),
        nextConstraintId: 4,
        highlighted: new Set(),
        result: null,
        notice: {
          type: "info",
          text: "サンプルデータとプリセット制約を読み込みました。"
        }
      };

      const el = {
        studentCountStat: document.querySelector("#studentCountStat"),
        groupCountStat: document.querySelector("#groupCountStat"),
        constraintCountStat: document.querySelector("#constraintCountStat"),
        groupCountButtons: document.querySelector("#groupCountButtons"),
        modeButtons: document.querySelector("#modeButtons"),
        relationButtons: document.querySelector("#relationButtons"),
        runButton: document.querySelector("#runButton"),
        rerollButton: document.querySelector("#rerollButton"),
        notice: document.querySelector("#notice"),
        resultStatus: document.querySelector("#resultStatus"),
        modeMetric: document.querySelector("#modeMetric"),
        groupMetric: document.querySelector("#groupMetric"),
        diffMetric: document.querySelector("#diffMetric"),
        groups: document.querySelector("#groups"),
        studentA: document.querySelector("#studentA"),
        studentB: document.querySelector("#studentB"),
        addConstraintButton: document.querySelector("#addConstraintButton"),
        constraintCountBadge: document.querySelector("#constraintCountBadge"),
        constraintList: document.querySelector("#constraintList"),
        studentDataInput: document.querySelector("#studentDataInput"),
        applyDataButton: document.querySelector("#applyDataButton"),
        resetDataButton: document.querySelector("#resetDataButton"),
        openVideoButton: document.querySelector("#openVideoButton"),
        closeVideoButton: document.querySelector("#closeVideoButton"),
        videoOverlay: document.querySelector("#videoOverlay"),
        creationVideo: document.querySelector("#creationVideo")
      };

      function init() {
        el.studentDataInput.value = formatStudentData(state.students);
        renderStudentOptions();
        bindEvents();
        render();
      }

      function bindEvents() {
        el.groupCountButtons.addEventListener("click", function (event) {
          const button = event.target.closest("button[data-group-count]");
          if (!button) return;
          state.groupCount = Number(button.dataset.groupCount);
          clearResult("設定を変更しました。");
          render();
        });

        el.modeButtons.addEventListener("click", function (event) {
          const button = event.target.closest("button[data-mode]");
          if (!button) return;
          state.mode = button.dataset.mode;
          clearResult("設定を変更しました。");
          render();
        });

        el.relationButtons.addEventListener("click", function (event) {
          const button = event.target.closest("button[data-relation]");
          if (!button) return;
          state.relation = button.dataset.relation;
          render();
        });

        el.runButton.addEventListener("click", runGrouping);
        el.rerollButton.addEventListener("click", runGrouping);
        el.addConstraintButton.addEventListener("click", addConstraint);
        el.applyDataButton.addEventListener("click", applyStudentData);
        el.resetDataButton.addEventListener("click", resetSampleData);
        el.openVideoButton.addEventListener("click", openVideo);
        el.closeVideoButton.addEventListener("click", closeVideo);
        el.videoOverlay.addEventListener("click", function (event) {
          if (event.target === el.videoOverlay) closeVideo();
        });
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") closeVideo();
        });

        el.constraintList.addEventListener("click", function (event) {
          const button = event.target.closest("button[data-delete-id]");
          if (!button) return;
          state.constraints = state.constraints.filter(function (constraint) {
            return constraint.id !== button.dataset.deleteId;
          });
          clearResult("制約を削除しました。");
          render();
        });
      }

      function openVideo() {
        el.videoOverlay.classList.add("is-open");
        el.videoOverlay.setAttribute("aria-hidden", "false");
        document.body.classList.add("video-lock");
        el.closeVideoButton.focus();
      }

      function closeVideo() {
        el.videoOverlay.classList.remove("is-open");
        el.videoOverlay.setAttribute("aria-hidden", "true");
        document.body.classList.remove("video-lock");
        el.creationVideo.pause();
      }

      function render() {
        renderActiveButtons();
        renderStats();
        renderNotice();
        renderConstraints();
        renderResult();
      }

      function renderActiveButtons() {
        setActiveButtons(el.groupCountButtons, "groupCount", String(state.groupCount));
        setActiveButtons(el.modeButtons, "mode", state.mode);
        setActiveButtons(el.relationButtons, "relation", state.relation);
      }

      function setActiveButtons(container, dataKey, value) {
        Array.prototype.forEach.call(container.querySelectorAll("button"), function (button) {
          const active = button.dataset[dataKey] === value;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", active ? "true" : "false");
        });
      }

      function renderStats() {
        el.studentCountStat.textContent = state.students.length + "名";
        el.groupCountStat.textContent = state.groupCount + "班";
        el.constraintCountStat.textContent = state.constraints.length + "件";
        el.constraintCountBadge.textContent = String(state.constraints.length);
        el.modeMetric.textContent = modeLabel(state.mode);
        el.groupMetric.textContent = String(state.groupCount);
      }

      function renderNotice() {
        el.notice.textContent = state.notice.text;
        el.notice.className = "notice " + state.notice.type;
      }

      function renderStudentOptions() {
        const options = state.students
          .map(function (student) {
            return '<option value="' + escapeHtml(student.name) + '">' + escapeHtml(student.name) + "</option>";
          })
          .join("");
        el.studentA.innerHTML = options;
        el.studentB.innerHTML = options;
        if (state.students[0]) el.studentA.value = state.students[0].name;
        if (state.students[1]) el.studentB.value = state.students[1].name;
      }

      function renderConstraints() {
        if (state.constraints.length === 0) {
          el.constraintList.innerHTML = '<div class="empty">制約なし</div>';
          return;
        }

        el.constraintList.innerHTML = state.constraints
          .map(function (constraint) {
            const relationClass = constraint.type === "same" ? "same" : "separate";
            const errorClass = state.highlighted.has(constraint.id) ? " is-error" : "";
            return (
              '<div class="constraint-item' + errorClass + '">' +
              '<div class="constraint-main">' +
              '<span class="constraint-type ' + relationClass + '">' +
              escapeHtml(relationLabel(constraint.type)) +
              "</span>" +
              '<span class="constraint-pair">' +
              escapeHtml(constraint.a) +
              " ・ " +
              escapeHtml(constraint.b) +
              "</span>" +
              "</div>" +
              '<button class="delete-button" type="button" data-delete-id="' +
              escapeHtml(constraint.id) +
              '">削除</button>' +
              "</div>"
            );
          })
          .join("");
      }

      function renderResult() {
        if (!state.result) {
          el.resultStatus.textContent = "待機";
          el.diffMetric.textContent = "--";
          el.groups.innerHTML = '<div class="empty">未実行</div>';
          return;
        }

        if (!state.result.ok) {
          el.resultStatus.textContent = "未成立";
          el.diffMetric.textContent = "--";
          el.groups.innerHTML =
            '<div class="empty"><strong>この制約は満たせません</strong><br>' +
            escapeHtml(state.result.message) +
            "</div>";
          return;
        }

        el.resultStatus.textContent = "完了";
        el.diffMetric.textContent = state.result.maxDiff.toFixed(2);
        el.groups.innerHTML = state.result.groups
          .map(function (group, index) {
            return (
              '<article class="group-card">' +
              '<div class="group-title">' +
              "<h3>" +
              (index + 1) +
              "班</h3>" +
              '<span class="group-average">' +
              group.average.toFixed(2) +
              "</span>" +
              "</div>" +
              '<div class="member-list">' +
              group.members
                .map(function (member) {
                  return (
                    '<div class="member">' +
                    '<span class="member-name">' +
                    escapeHtml(member.name) +
                    "</span>" +
                    '<span class="member-gpa">' +
                    member.gpa.toFixed(2) +
                    "</span>" +
                    "</div>"
                  );
                })
                .join("") +
              "</div>" +
              "</article>"
            );
          })
          .join("");
      }

      function addConstraint() {
        const a = el.studentA.value;
        const b = el.studentB.value;
        const type = state.relation;
        const pair = pairKey(a, b);

        if (a === b) {
          state.highlighted = new Set();
          state.notice = { type: "error", text: "同じ学生同士の制約は追加できません。" };
          render();
          return;
        }

        const duplicate = state.constraints.find(function (constraint) {
          return pairKey(constraint.a, constraint.b) === pair && constraint.type === type;
        });

        if (duplicate) {
          state.highlighted = new Set([duplicate.id]);
          state.notice = { type: "info", text: "同じ制約は登録済みです。" };
          render();
          return;
        }

        const contradiction = state.constraints.find(function (constraint) {
          return pairKey(constraint.a, constraint.b) === pair && constraint.type !== type;
        });

        if (contradiction) {
          state.highlighted = new Set([contradiction.id]);
          state.result = null;
          state.notice = {
            type: "error",
            text: "矛盾する制約です。同じ2名に対して「同じ班」と「別の班」は同時に指定できません。"
          };
          render();
          return;
        }

        state.constraints.push({
          id: "c" + state.nextConstraintId,
          a: a,
          b: b,
          type: type
        });
        state.nextConstraintId += 1;
        clearResult("制約を追加しました。", "success");
        render();
      }

      function applyStudentData() {
        const parsed = parseStudentData(el.studentDataInput.value);
        if (!parsed.ok) {
          state.notice = { type: "error", text: parsed.message };
          render();
          return;
        }

        const newNameSet = new Set(parsed.students.map(function (student) { return student.name; }));
        const before = state.constraints.length;
        state.students = parsed.students;
        state.constraints = state.constraints.filter(function (constraint) {
          return newNameSet.has(constraint.a) && newNameSet.has(constraint.b);
        });
        state.highlighted = new Set();
        state.result = null;
        el.studentDataInput.value = formatStudentData(state.students);
        renderStudentOptions();

        const removed = before - state.constraints.length;
        state.notice = {
          type: removed > 0 ? "info" : "success",
          text: removed > 0
            ? "データを反映し、存在しない学生の制約を外しました。"
            : "データを反映しました。"
        };
        render();
      }

      function resetSampleData() {
        state.students = cloneStudents(SAMPLE_STUDENTS);
        state.constraints = makePresetConstraints();
        state.nextConstraintId = 4;
        state.highlighted = new Set();
        state.result = null;
        el.studentDataInput.value = formatStudentData(state.students);
        renderStudentOptions();
        state.notice = { type: "info", text: "サンプルデータとプリセット制約に戻しました。" };
        render();
      }

      function runGrouping() {
        const solution = solve();
        state.result = solution;
        state.highlighted = new Set(solution.causeIds || []);

        state.notice = solution.ok
          ? {
              type: "success",
              text: "グループ分けが完了しました。GPA平均の最大差は " + solution.maxDiff.toFixed(2) + " です。"
            }
          : {
              type: "error",
              text: "この制約は満たせません。赤く表示した制約を見直してください。"
            };

        render();
      }

      function solve() {
        if (state.students.length < 2) {
          return {
            ok: false,
            causeIds: [],
            message: "学生が2名以上必要です。"
          };
        }

        const model = buildConstraintModel();
        if (!model.ok) {
          return {
            ok: false,
            causeIds: model.causeIds,
            message: model.message
          };
        }

        if (model.units.length < state.groupCount) {
          return {
            ok: false,
            causeIds: state.constraints
              .filter(function (constraint) { return constraint.type === "same"; })
              .map(function (constraint) { return constraint.id; }),
            message: "同じ班に結合されたまとまりが班数より少ないため、全班に学生を配置できません。"
          };
        }

        const cliqueCause = findCliqueCause(model);
        if (cliqueCause.length > 0) {
          return {
            ok: false,
            causeIds: cliqueCause,
            message: "班数より多いまとまりが、互いに別の班として指定されています。"
          };
        }

        const attempts = state.mode === "gpa" ? 2200 : 1400;
        const blockerCounts = new Map();

        for (let attempt = 0; attempt < attempts; attempt += 1) {
          const assignment = greedyAssign(model, blockerCounts);
          if (!assignment) continue;

          let groups = buildGroupsFromAssignment(assignment, model);
          if (groups.some(function (group) { return group.size === 0; })) continue;
          if (!verifyGroups(groups, model)) continue;

          if (state.mode === "gpa") {
            groups = improveGpa(groups, model);
            if (groups.some(function (group) { return group.size === 0; })) continue;
            if (!verifyGroups(groups, model)) continue;
          }

          const finalized = finalizeGroups(groups);
          return {
            ok: true,
            groups: finalized.groups,
            maxDiff: finalized.maxDiff,
            causeIds: []
          };
        }

        const causeIds = Array.from(blockerCounts.entries())
          .sort(function (a, b) { return b[1] - a[1]; })
          .slice(0, 10)
          .map(function (entry) { return entry[0]; });

        return {
          ok: false,
          causeIds: causeIds.length > 0
            ? causeIds
            : state.constraints.map(function (constraint) { return constraint.id; }),
          message: "規定回数のリトライで、すべての制約を満たす組み合わせが見つかりませんでした。"
        };
      }

      function buildConstraintModel() {
        const dsu = createDisjointSet(state.students.map(function (student) { return student.name; }));

        state.constraints.forEach(function (constraint) {
          if (constraint.type === "same") dsu.union(constraint.a, constraint.b);
        });

        const components = new Map();
        state.students.forEach(function (student) {
          const root = dsu.find(student.name);
          if (!components.has(root)) {
            components.set(root, { students: [], sum: 0, size: 0 });
          }
          const component = components.get(root);
          component.students.push(student);
          component.sum += student.gpa;
          component.size += 1;
        });

        const units = Array.from(components.values()).map(function (component, index) {
          component.students.sort(compareStudents);
          return {
            index: index,
            students: component.students,
            sum: component.sum,
            size: component.size,
            average: component.sum / component.size
          };
        });

        const studentToUnit = new Map();
        units.forEach(function (unit) {
          unit.students.forEach(function (student) {
            studentToUnit.set(student.name, unit.index);
          });
        });

        const adjacency = units.map(function () { return new Set(); });
        const edgeConstraints = new Map();
        const immediateCauses = new Set();

        state.constraints.forEach(function (constraint) {
          if (constraint.type !== "separate") return;
          const left = studentToUnit.get(constraint.a);
          const right = studentToUnit.get(constraint.b);

          if (left === right) {
            immediateCauses.add(constraint.id);
            state.constraints.forEach(function (sameConstraint) {
              if (
                sameConstraint.type === "same" &&
                studentToUnit.get(sameConstraint.a) === left &&
                studentToUnit.get(sameConstraint.b) === left
              ) {
                immediateCauses.add(sameConstraint.id);
              }
            });
            return;
          }

          adjacency[left].add(right);
          adjacency[right].add(left);
          const key = unitPairKey(left, right);
          if (!edgeConstraints.has(key)) edgeConstraints.set(key, []);
          edgeConstraints.get(key).push(constraint.id);
        });

        if (immediateCauses.size > 0) {
          return {
            ok: false,
            causeIds: Array.from(immediateCauses),
            message: "同じ班として結合された学生同士に、別の班の制約があります。"
          };
        }

        const totalGpa = state.students.reduce(function (sum, student) {
          return sum + student.gpa;
        }, 0);

        return {
          ok: true,
          units: units,
          adjacency: adjacency,
          edgeConstraints: edgeConstraints,
          globalAverage: totalGpa / state.students.length
        };
      }

      function greedyAssign(model, blockerCounts) {
        const assignment = new Array(model.units.length).fill(-1);
        const order = buildUnitOrder(model);
        let groups = makeEmptyGroups();

        for (let position = 0; position < order.length; position += 1) {
          const unit = order[position];
          const available = [];
          const blockers = [];

          for (let groupIndex = 0; groupIndex < state.groupCount; groupIndex += 1) {
            const conflicts = groups[groupIndex].unitIndexes.filter(function (placedUnitIndex) {
              return model.adjacency[unit.index].has(placedUnitIndex);
            });

            if (conflicts.length === 0) {
              available.push(groupIndex);
            } else {
              conflicts.forEach(function (conflictIndex) {
                const ids = model.edgeConstraints.get(unitPairKey(unit.index, conflictIndex)) || [];
                ids.forEach(function (id) { blockers.push(id); });
              });
            }
          }

          if (available.length === 0) {
            blockers.forEach(function (id) {
              blockerCounts.set(id, (blockerCounts.get(id) || 0) + 1);
            });
            return null;
          }

          const chosenGroup = chooseGroup(available, groups, unit, model, position, order.length);
          assignment[unit.index] = chosenGroup;
          groups = placeUnit(groups, chosenGroup, unit);
        }

        return assignment;
      }

      function buildUnitOrder(model) {
        const copied = shuffle(model.units.slice());

        copied.sort(function (a, b) {
          const degreeDiff = model.adjacency[b.index].size - model.adjacency[a.index].size;
          if (degreeDiff !== 0) return degreeDiff;

          if (state.mode === "gpa") {
            const aDistance = Math.abs(a.average - model.globalAverage);
            const bDistance = Math.abs(b.average - model.globalAverage);
            if (bDistance !== aDistance) return bDistance - aDistance;
          }

          if (b.size !== a.size) return b.size - a.size;
          return Math.random() - 0.5;
        });

        return copied;
      }

      function chooseGroup(available, groups, unit, model, position, orderLength) {
        const emptyAvailable = available.filter(function (groupIndex) {
          return groups[groupIndex].size === 0;
        });
        const emptyCount = groups.filter(function (group) {
          return group.size === 0;
        }).length;
        const remainingIncludingCurrent = orderLength - position;

        if (emptyAvailable.length > 0 && remainingIncludingCurrent <= emptyCount) {
          return randomItem(emptyAvailable);
        }

        if (state.mode === "random") {
          const targetMax = Math.ceil(state.students.length / state.groupCount);
          let candidates = available.filter(function (groupIndex) {
            return groups[groupIndex].size + unit.size <= targetMax;
          });
          if (candidates.length === 0) candidates = available.slice();

          const minSize = Math.min.apply(null, candidates.map(function (groupIndex) {
            return groups[groupIndex].size;
          }));
          const lightGroups = candidates.filter(function (groupIndex) {
            return groups[groupIndex].size <= minSize + 1;
          });
          return randomItem(lightGroups);
        }

        const scored = available.map(function (groupIndex) {
          return {
            groupIndex: groupIndex,
            score: scorePlacement(groups, groupIndex, unit, model) + Math.random() * 0.0005
          };
        });
        const bestScore = Math.min.apply(null, scored.map(function (item) {
          return item.score;
        }));
        const best = scored.filter(function (item) {
          return item.score <= bestScore + 0.0001;
        });

        return randomItem(best).groupIndex;
      }

      function scorePlacement(groups, groupIndex, unit, model) {
        const simulated = groups.map(function (group, index) {
          return {
            size: group.size + (index === groupIndex ? unit.size : 0),
            sum: group.sum + (index === groupIndex ? unit.sum : 0)
          };
        });
        const averages = simulated.map(function (group) {
          return group.size > 0 ? group.sum / group.size : model.globalAverage;
        });
        const maxAverage = Math.max.apply(null, averages);
        const minAverage = Math.min.apply(null, averages);
        const sizes = simulated.map(function (group) { return group.size; });
        const sizeSpread = Math.max.apply(null, sizes) - Math.min.apply(null, sizes);
        const targetMax = Math.ceil(state.students.length / state.groupCount);
        const overflow = simulated.reduce(function (sum, group) {
          return sum + Math.max(0, group.size - targetMax);
        }, 0);

        return (maxAverage - minAverage) + sizeSpread * 0.035 + overflow * 0.25;
      }

      function improveGpa(groups, model) {
        const assignment = groupsToAssignment(groups, model.units.length);
        let bestScore = scoreAssignment(assignment, model);

        for (let pass = 0; pass < 70; pass += 1) {
          let bestMove = null;

          for (let unitIndex = 0; unitIndex < model.units.length; unitIndex += 1) {
            const fromGroup = assignment[unitIndex];
            for (let toGroup = 0; toGroup < state.groupCount; toGroup += 1) {
              if (fromGroup === toGroup) continue;
              if (!canMoveUnit(unitIndex, toGroup, assignment, model)) continue;

              assignment[unitIndex] = toGroup;
              const score = scoreAssignment(assignment, model);
              assignment[unitIndex] = fromGroup;

              if (score + 0.0001 < bestScore) {
                bestScore = score;
                bestMove = { kind: "move", unitIndex: unitIndex, toGroup: toGroup };
              }
            }
          }

          for (let a = 0; a < model.units.length; a += 1) {
            for (let b = a + 1; b < model.units.length; b += 1) {
              const groupA = assignment[a];
              const groupB = assignment[b];
              if (groupA === groupB) continue;
              if (!canSwapUnits(a, b, assignment, model)) continue;

              assignment[a] = groupB;
              assignment[b] = groupA;
              const score = scoreAssignment(assignment, model);
              assignment[a] = groupA;
              assignment[b] = groupB;

              if (score + 0.0001 < bestScore) {
                bestScore = score;
                bestMove = { kind: "swap", a: a, b: b };
              }
            }
          }

          if (!bestMove) break;

          if (bestMove.kind === "move") {
            assignment[bestMove.unitIndex] = bestMove.toGroup;
          } else {
            const oldGroup = assignment[bestMove.a];
            assignment[bestMove.a] = assignment[bestMove.b];
            assignment[bestMove.b] = oldGroup;
          }
        }

        return buildGroupsFromAssignment(assignment, model);
      }

      function canMoveUnit(unitIndex, targetGroup, assignment, model) {
        const originalGroup = assignment[unitIndex];
        const sourceHasOtherUnits = assignment.some(function (groupIndex, otherUnitIndex) {
          return otherUnitIndex !== unitIndex && groupIndex === originalGroup;
        });

        if (!sourceHasOtherUnits) return false;

        for (let other = 0; other < assignment.length; other += 1) {
          if (other === unitIndex) continue;
          if (assignment[other] === targetGroup && model.adjacency[unitIndex].has(other)) {
            return false;
          }
        }

        return true;
      }

      function canSwapUnits(a, b, assignment, model) {
        const groupA = assignment[a];
        const groupB = assignment[b];

        for (let other = 0; other < assignment.length; other += 1) {
          if (other === a || other === b) continue;
          if (assignment[other] === groupB && model.adjacency[a].has(other)) return false;
          if (assignment[other] === groupA && model.adjacency[b].has(other)) return false;
        }

        return true;
      }

      function scoreAssignment(assignment, model) {
        const groups = buildGroupsFromAssignment(assignment, model);
        const finalized = finalizeGroups(groups);
        const sizes = finalized.groups.map(function (group) { return group.size; });
        const sizeSpread = Math.max.apply(null, sizes) - Math.min.apply(null, sizes);
        const emptyPenalty = finalized.groups.filter(function (group) {
          return group.size === 0;
        }).length * 10;

        return finalized.maxDiff + sizeSpread * 0.02 + emptyPenalty;
      }

      function verifyGroups(groups, model) {
        const assignment = groupsToAssignment(groups, model.units.length);

        for (let unitIndex = 0; unitIndex < model.units.length; unitIndex += 1) {
          for (const neighborIndex of model.adjacency[unitIndex]) {
            if (assignment[unitIndex] === assignment[neighborIndex]) return false;
          }
        }

        return true;
      }

      function makeEmptyGroups() {
        return Array.from({ length: state.groupCount }, function () {
          return { unitIndexes: [], members: [], sum: 0, size: 0 };
        });
      }

      function placeUnit(groups, groupIndex, unit) {
        const next = groups.map(function (group) {
          return {
            unitIndexes: group.unitIndexes.slice(),
            members: group.members.slice(),
            sum: group.sum,
            size: group.size
          };
        });
        next[groupIndex].unitIndexes.push(unit.index);
        next[groupIndex].members = next[groupIndex].members.concat(unit.students);
        next[groupIndex].sum += unit.sum;
        next[groupIndex].size += unit.size;
        return next;
      }

      function buildGroupsFromAssignment(assignment, model) {
        let groups = makeEmptyGroups();
        model.units.forEach(function (unit) {
          groups = placeUnit(groups, assignment[unit.index], unit);
        });
        return groups;
      }

      function groupsToAssignment(groups, unitCount) {
        const assignment = new Array(unitCount).fill(-1);
        groups.forEach(function (group, groupIndex) {
          group.unitIndexes.forEach(function (unitIndex) {
            assignment[unitIndex] = groupIndex;
          });
        });
        return assignment;
      }

      function finalizeGroups(groups) {
        const finalizedGroups = groups.map(function (group) {
          const members = group.members.slice().sort(compareStudents);
          return {
            members: members,
            size: members.length,
            sum: group.sum,
            average: members.length > 0 ? group.sum / members.length : 0
          };
        });

        const averages = finalizedGroups.map(function (group) {
          return group.average;
        });

        return {
          groups: finalizedGroups,
          maxDiff: Math.max.apply(null, averages) - Math.min.apply(null, averages)
        };
      }

      function findCliqueCause(model) {
        const need = state.groupCount + 1;
        if (model.units.length < need) return [];

        const vertices = model.units
          .map(function (unit) { return unit.index; })
          .sort(function (a, b) { return model.adjacency[b].size - model.adjacency[a].size; });

        const clique = expandClique([], vertices, need, model.adjacency);
        if (!clique) return [];

        const causeIds = new Set();
        for (let i = 0; i < clique.length; i += 1) {
          for (let j = i + 1; j < clique.length; j += 1) {
            const ids = model.edgeConstraints.get(unitPairKey(clique[i], clique[j])) || [];
            ids.forEach(function (id) { causeIds.add(id); });
          }
        }

        return Array.from(causeIds);
      }

      function expandClique(clique, candidates, need, adjacency) {
        if (clique.length === need) return clique;
        if (clique.length + candidates.length < need) return null;

        for (let i = 0; i < candidates.length; i += 1) {
          const vertex = candidates[i];
          const nextCandidates = candidates.slice(i + 1).filter(function (candidate) {
            return adjacency[vertex].has(candidate);
          });
          const found = expandClique(clique.concat(vertex), nextCandidates, need, adjacency);
          if (found) return found;
        }

        return null;
      }

      function createDisjointSet(ids) {
        const parent = new Map();
        ids.forEach(function (id) { parent.set(id, id); });

        function find(id) {
          const current = parent.get(id);
          if (current === id) return id;
          const root = find(current);
          parent.set(id, root);
          return root;
        }

        function union(a, b) {
          const rootA = find(a);
          const rootB = find(b);
          if (rootA !== rootB) parent.set(rootB, rootA);
        }

        return { find: find, union: union };
      }

      function parseStudentData(text) {
        const lines = text.split(/\r?\n/).map(function (line) {
          return line.trim();
        }).filter(Boolean);

        if (lines.length < 2) {
          return { ok: false, message: "学生データは2名以上必要です。" };
        }

        const parsed = [];
        const names = new Set();

        for (let index = 0; index < lines.length; index += 1) {
          const line = lines[index];
          if (index === 0 && /^(氏名|名前|name)\s*[,，\t]/i.test(line)) continue;

          const parts = line.split(/[,，\t]/).map(function (part) {
            return part.trim();
          });

          if (parts.length < 2 || !parts[0]) {
            return { ok: false, message: "学生データの " + (index + 1) + " 行目を確認してください。" };
          }

          const name = parts[0];
          const gpa = Number(parts[1]);

          if (names.has(name)) {
            return { ok: false, message: "学生名が重複しています: " + name };
          }

          if (!Number.isFinite(gpa) || gpa < 0 || gpa > 4) {
            return { ok: false, message: "GPAは0.00〜4.00で入力してください: " + name };
          }

          names.add(name);
          parsed.push({ name: name, gpa: Math.round(gpa * 100) / 100 });
        }

        if (parsed.length < 2) {
          return { ok: false, message: "学生データは2名以上必要です。" };
        }

        return { ok: true, students: parsed };
      }

      function formatStudentData(students) {
        return students.map(function (student) {
          return student.name + "," + student.gpa.toFixed(2);
        }).join("\n");
      }

      function makePresetConstraints() {
        return PRESET_CONSTRAINTS.map(function (constraint, index) {
          return {
            id: "c" + (index + 1),
            a: constraint.a,
            b: constraint.b,
            type: constraint.type
          };
        });
      }

      function cloneStudents(students) {
        return students.map(function (student) {
          return { name: student.name, gpa: student.gpa };
        });
      }

      function clearResult(text, type) {
        state.result = null;
        state.highlighted = new Set();
        state.notice = { type: type || "info", text: text };
      }

      function modeLabel(mode) {
        return mode === "random" ? "完全ランダム" : "GPA均等化";
      }

      function relationLabel(type) {
        return type === "same" ? "同じ班" : "別の班";
      }

      function pairKey(a, b) {
        return [a, b].sort().join("|");
      }

      function unitPairKey(a, b) {
        return a < b ? a + "|" + b : b + "|" + a;
      }

      function compareStudents(a, b) {
        return a.name.localeCompare(b.name, "ja", { numeric: true, sensitivity: "base" });
      }

      function shuffle(items) {
        for (let i = items.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = items[i];
          items[i] = items[j];
          items[j] = temp;
        }
        return items;
      }

      function randomItem(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      init();
    </script>
  </body>
